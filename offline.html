<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16766e">
<title>Hors ligne — Location et vente immobilière</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f8f6; color: #14201d; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 360px; }
  .mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px; background: #16766e; color: #fff; font: 700 34px Georgia, serif; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; } p { margin: 0 0 20px; color: #64736d; }
  button { padding: 12px 22px; border: 0; border-radius: 10px; background: #16766e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">M</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Vérifiez votre connexion Internet, puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
